    modern: false
    price-cents: 800
    stock-per-allocation: 5
    cap-per-visit: 0
    source: Niko's Nook prototype
    book:
      title: small things worth keeping
      author: Pip
      generation: COPY_OF_COPY
      pages:
        - |-
          a pocket inventory

          one smooth pebble. a seed i meant to plant. a ribbon from a parcel. three crumbs, though i am fairly sure there used to be a biscuit.

          not every treasure needs a chest.
        - |-
          a note for tomorrow

          plant the seed. share the biscuit. leave a light in the window.

          the pebble can stay in my pocket a little longer <3
