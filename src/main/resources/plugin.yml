name: NookCore
version: 0.1.0-SNAPSHOT
main: net.nikosnook.core.NookCorePlugin
api-version: '26.2'
description: quests, shops, and small comforts!
author: NikosNook
softdepend: [FancyNpcs, DiscordSRV, Vault, WorldGuard, WorldEdit, PlaceholderAPI]
loadbefore: [ChestShop]
commands:
  games:
    description: Find a little game or collect game winnings
    permission: nookcore.games
    usage: /games [help|collect]
  coinflip:
    description: A friendly equal-stake coin flip
    permission: nookcore.coinflip
    usage: /coinflip [invite <player> <amount>|accept <player>|decline <player>|cancel|history|collect]
  wordle:
    description: a little daily word puzzle
    usage: /wordle [word|help|share]
  pvp:
    description: toggle pvp.
    usage: /pvp [on|off|status]
  staff:
    description: Message online helpers and admins privately
    aliases: [sc]
    permission: nookcore.staff.chat
    usage: /staff <message>
  list:
    description: List visible online players
    usage: /list
  staffmode:
    description: Hidden spectator tools and saved return position
    usage: /staffmode [on [disconnect]|off [confirm]|list|tp <player>|spectate <player>]
  bunny:
    description: Bunny boots time and charging
    usage: /bunny
  baltop:
    description: View the Nooks balance leaderboard
    usage: /baltop [page]
  return:
    description: Return after a staff teleport
    permission: nookcore.admin
    usage: /return [player]
  nookshops:
    description: Create and manage shops, stock and item collections
    usage: /nookshops help
  smite:
    description: Call down the heavens
    usage: /smite <player>
  quests:
    description: Weekly quest progress and rewards
    usage: /quests
  nookchat:
    description: Set your chat name colour and pronouns
    usage: /nookchat
  plots:
    description: Plot rentals, invitations, permissions and rent payments
    usage: /plots
  nooks:
    description: Balance, transfers and transaction history
    usage: /nooks [pay <player> <amount>|history]
  nookadmin:
    description: Audited economy administration
    permission: nookcore.admin
    usage: /nookadmin <status|teleport|return> ...
permissions:
  nookcore.games:
    default: true
  nookcore.coinflip:
    default: true
  nookcore.wordle:
    description: Play the daily word puzzle
    default: true
  nookcore.pvp:
    description: Enable your own PvP preference
    default: true
  nookcore.staff:
    description: Staff mode tools without economy administration or general teleport bypass
    default: op
    children:
      nookcore.staff.use: true
      nookcore.staff.see: true
      nookcore.staff.teleport: true
      nookcore.staff.inspect: true
      tab.seevanished: true
  nookcore.staff.chat:
    description: Send and receive private staff chat
    default: op
  nookcore.staff.use:
    default: op
    children:
      nookcore.staff.chat: true
  nookcore.staff.see:
    default: op
  nookcore.staff.teleport:
    default: op
  nookcore.staff.inspect:
    default: op
  nookcore.chat.rank.owner:
    description: Cosmetic owner rank only; does not grant staff access
    default: false
  nookcore.chat.rank.admin:
    default: false
  nookcore.chat.rank.helper:
    default: false
  nookcore.chat.rank.supporter:
    default: false
  nookcore.admin:
    default: op
    children:
      nookcore.staff.chat: true
  nookcore.travel.bypass:
    description: Owner/admin moderation travel only; never grant to helpers
    default: op
