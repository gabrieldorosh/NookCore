# Merge BELOW the existing chat: key; this is not a complete config.
  # Private keyword tips; never cancels chat, pings staff, or runs commands.
  # Built-in defaults apply if this section is absent. Changes require a restart.
  help-replies:
    enabled: true
    cooldown-seconds: 300
    topics:
      lag:
        phrases: [lag, lagging, laggy]
        reply: "Seeing lag? TAB shows the server TPS. When asking staff for help, describe whether you see low FPS, freezing, or rubber-banding, and when it started. TPS alone does not explain every issue."
      staff:
        phrases: [admin, admins, staff, helper, helpers]
        reply: "Need staff help? Describe the issue in chat, or contact an admin privately on the server Discord for sensitive reports. This tip does not notify or summon staff."
